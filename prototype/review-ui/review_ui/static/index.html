<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pose Estimation Review</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- Pins the theme before the first paint, so a stored dark preference never
         flashes light.  It is the only resolver: app.js reads the choice back off
         `data-theme` instead of deriving it a second time.  Absent attribute =
         auto, which style.css answers with `light-dark()` and no script at all. -->
    <script>
      (() => {
        const requested = new URLSearchParams(location.search).get("theme");
        const pinned = ["light", "dark"].includes(requested)
          ? requested
          : localStorage.getItem("review-ui-theme");
        if (pinned === "light" || pinned === "dark") document.documentElement.dataset.theme = pinned;
      })();
    </script>
    <script src="/static/vendor/plotly-cartesian.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1 data-i18n="app.title">姿勢推定レビュー</h1>
          <p class="subtitle" data-i18n="app.subtitle"></p>
        </div>
        <span class="badge" data-i18n="app.prototype"></span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab" data-view="player" data-i18n="nav.player"></button>
        <button class="tab" data-view="census" data-i18n="nav.census"></button>
        <button class="tab" data-view="cohort" data-i18n="nav.cohort"></button>
      </nav>
      <button class="theme" id="theme-toggle" type="button"></button>
      <button class="lang" id="lang-toggle" type="button">EN</button>
    </header>

    <main>
      <section id="view-player" class="view"></section>
      <section id="view-census" class="view"></section>
      <section id="view-cohort" class="view"></section>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
