[project]
name = "review-ui"
version = "0.1.0"
description = "Local review UI over the 3-cam corpus: census, clip player with pose overlay, cohort explorer."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
# Asset builder only. It writes into static/ and does not run at serve time.
dev = [
  "fonttools[woff]>=4.55,<5",
]

[tool.uv]
# No build backend: the server runs as `python -m review_ui` with the project
# directory on sys.path, so nothing installs the prototype itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

# Ruff resolves settings from the closest pyproject.toml, so the root gate's
# rule set does not reach this tree unless it is restated here.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PIE", "RET", "PTH", "RUF", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["T201"]  # asset builders report to stdout
# The font subset charset names the full-width and typographic code points the
# UI actually draws; every one of them is deliberate, not a homoglyph slip.
"tools/build_assets.py" = ["RUF001", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
